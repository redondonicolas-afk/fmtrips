<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Stats ⚽</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh}
header{background:#111;border-bottom:1px solid #222;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:18px;font-weight:700;color:#fff}
.header-sub{font-size:11px;color:#666;margin-top:2px}
.back-btn{font-size:12px;color:#666;text-decoration:none;padding:6px 12px;border:1px solid #333;border-radius:6px}
.back-btn:hover{color:#fff;border-color:#555}
.container{max-width:960px;margin:0 auto;padding:1.5rem}

/* Stats globales */
.global-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem}
.gstat{background:#111;border:1px solid #222;border-radius:12px;padding:1rem;text-align:center}
.gstat-v{font-size:28px;font-weight:700;color:#fff}
.gstat-l{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* Hall of fame */
.section-title{font-size:13px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.hof{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:2rem}
.hof-card{background:#111;border:1px solid #222;border-radius:10px;padding:12px;text-align:center}
.hof-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:4px}
.hof-titulos{font-size:11px;color:#f59e0b}
.hof-star{font-size:14px}
.hof-card.gold{border-color:#f59e0b44;background:#f59e0b0a}
.hof-card.silver{border-color:#9ca3af44}
.hof-card.bronze{border-color:#cd7c3244}

/* Temporadas */
.seasons-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:2rem}
.season-card{background:#111;border:1px solid #222;border-radius:12px;padding:1rem;cursor:pointer;transition:border-color .15s}
.season-card:hover{border-color:#444}
.season-card.active{border-color:#3b82f6}
.season-card.current{border-color:#22c55e44;background:#22c55e08}
.season-num{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.06em}
.season-champ{font-size:16px;font-weight:700;color:#fff;margin:4px 0}
.season-dates{font-size:10px;color:#555;margin-bottom:8px}
.season-meta{display:flex;gap:8px}
.season-badge{font-size:10px;padding:2px 7px;border-radius:4px;background:#1a1a1a;color:#888;border:1px solid #2a2a2a}
.podium{display:flex;gap:4px;margin-top:8px}
.podium-item{font-size:10px;color:#666}
.podium-item span{color:#fff}
.podium-item.p1{color:#f59e0b}
.podium-item.p1 span{color:#f59e0b}

/* Tabla detalle temporada */
.season-detail{background:#111;border:1px solid #3b82f6;border-radius:12px;padding:1.25rem;margin-bottom:2rem;display:none}
.season-detail.visible{display:block}
.detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.detail-title{font-size:16px;font-weight:700;color:#fff}
.detail-meta{font-size:11px;color:#666}
.tabla{width:100%;border-collapse:collapse}
.tabla th{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;text-align:right;border-bottom:1px solid #1a1a1a}
.tabla th:first-child,.tabla th:nth-child(2){text-align:left}
.tabla td{padding:7px 8px;text-align:right;font-size:12px;border-bottom:1px solid #161616;color:#ccc}
.tabla td:first-child{text-align:left;color:#888;font-size:11px;min-width:20px}
.tabla td:nth-child(2){text-align:left;font-weight:500;color:#fff}
.tabla tr:hover td{background:#161616}
.tabla tr.rank-1 td{color:#f59e0b}
.tabla tr.rank-1 td:nth-child(2){color:#f59e0b}
.tabla tr.rank-2 td:nth-child(2){color:#9ca3af}
.tabla tr.rank-3 td:nth-child(2){color:#cd7c32}
.pts-badge{display:inline-block;background:#1a2a3a;color:#60a5fa;padding:1px 7px;border-radius:4px;font-weight:600;font-size:12px}
.close-btn{background:none;border:1px solid #333;color:#666;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px}
.close-btn:hover{color:#fff;border-color:#555}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:1.5rem;background:#111;padding:4px;border-radius:10px;border:1px solid #222}
.tab{padding:7px 16px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:#666;transition:all .15s}
.tab.active{background:#1a1a1a;color:#fff;border:1px solid #333}
.tab-content{display:none}
.tab-content.active{display:block}

/* Histórico */
.hist-table{width:100%;border-collapse:collapse}
.hist-table th{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.05em;padding:8px;text-align:right;border-bottom:1px solid #1a1a1a}
.hist-table th:first-child,.hist-table th:nth-child(2){text-align:left}
.hist-table td{padding:8px;text-align:right;font-size:12px;border-bottom:1px solid #161616;color:#ccc}
.hist-table td:first-child{text-align:left;color:#888;font-size:11px}
.hist-table td:nth-child(2){text-align:left;font-weight:500;color:#fff}
.hist-table tr:hover td{background:#161616}
.bar-mini{height:4px;background:#1a1a1a;border-radius:2px;margin-top:3px}
.bar-fill{height:4px;border-radius:2px;background:#3b82f6}
.titulo-badge{display:inline-block;width:14px;height:14px;background:#f59e0b;border-radius:50%;font-size:8px;color:#000;text-align:center;line-height:14px;font-weight:700;margin-left:2px}

@media(max-width:600px){
  .global-grid{grid-template-columns:repeat(2,1fr)}
  .hof{grid-template-columns:repeat(2,1fr)}
  .seasons-grid{grid-template-columns:repeat(2,1fr)}
  .gstat-v{font-size:22px}
}
</style>
</head>

  <!-- Tabs -->
  <div class="tabs">

</div>

let activeSeasonId = null;

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`[onclick="showTab('${tab}')"]`).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if(tab === 'historico') renderHistorico();
  if(tab === 'campeones') renderCampeones();
}

function renderSeasons() {
  const grid = document.getElementById('seasons-grid');
  grid.innerHTML = SEASONS.map(s => {
    const isCurrent = s.temporada === 14;
    return `<div class="season-card ${isCurrent?'current':''}" id="sc-${s.temporada}" onclick="toggleSeason(${s.temporada})">
      <div class="season-num">Temporada ${s.temporada} ${isCurrent?'🟢 en curso':''}</div>
      <div class="season-champ">🏆 ${s.campeon}</div>
      <div class="season-dates">${s.fecha_ini} → ${s.fecha_fin}</div>
      <div class="season-meta">
        <span class="season-badge">${s.partidos} partidos</span>
        <span class="season-badge">${s.jugadores.length} jugadores</span>
      </div>
      <div class="podium">
        <div class="podium-item p1">🥇 <span>${s.campeon}</span></div>
        <div class="podium-item" style="margin-left:8px">🥈 <span>${s.subcampeon}</span></div>
        <div class="podium-item" style="margin-left:8px">🥉 <span>${s.tercero}</span></div>
      </div>
    </div>`;
  }).join('');
}

function toggleSeason(id) {
  const detail = document.getElementById('season-detail');
  if(activeSeasonId === id) {
    detail.classList.remove('visible');
    detail.style.display = 'none';
    document.getElementById('sc-'+id)?.classList.remove('active');
    activeSeasonId = null;
    return;
  }
  if(activeSeasonId) document.getElementById('sc-'+activeSeasonId)?.classList.remove('active');
  activeSeasonId = id;
  document.getElementById('sc-'+id)?.classList.add('active');
  const s = SEASONS.find(x => x.temporada === id);
  const maxPts = s.jugadores[0]?.pts || 1;
  detail.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-title">Temporada ${s.temporada} — ${s.campeon} 🏆</div>
        <div class="detail-meta">${s.fecha_ini} → ${s.fecha_fin} · ${s.partidos} partidos</div>
      </div>
      <button class="close-btn" onclick="toggleSeason(${id})">cerrar ✕</button>
    </div>
    <table class="tabla">
      <thead><tr>
        <th>#</th><th>Jugador</th><th>PTS</th><th>J</th><th>G</th><th>E</th><th>P</th><th>%</th>
      </tr></thead>
      <tbody>
        ${s.jugadores.map((p,i) => `<tr class="${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':''}">
          <td>${i+1}</td>
          <td>${p.name}</td>
          <td><span class="pts-badge">${p.pts}</span></td>
          <td>${p.j}</td>
          <td>${p.g >= 0 ? p.g : '-'}</td>
          <td>${p.e <= 100 ? p.e : '-'}</td>
          <td>${p.p >= 0 ? p.p : '-'}</td>
          <td>${p.j > 0 ? Math.round(p.pts/p.j*10)/10 : '-'}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  detail.style.display = 'block';
  detail.classList.add('visible');
  detail.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderHistorico() {
  const totales = {};
  SEASONS.forEach(s => {
    s.jugadores.forEach(p => {
      if(!totales[p.name]) totales[p.name] = {pts:0, j:0, g:0, titulos:0, podios:0, temporadas:0};
      totales[p.name].pts += p.pts;
      totales[p.name].j += p.j;
      if(p.g > 0) totales[p.name].g += p.g;
      totales[p.name].temporadas++;
    });
    [s.campeon, s.subcampeon, s.tercero].forEach((n,i) => {
      if(n && totales[n]) {
        if(i===0) totales[n].titulos++;
        totales[n].podios++;
      }
    });
  });
  const sorted = Object.entries(totales).sort((a,b)=>b[1].pts-a[1].pts);
  const maxPts = sorted[0][1].pts;
  const el = document.getElementById('hist-content');
  el.innerHTML = `<table class="hist-table">
    <thead><tr><th>#</th><th>Jugador</th><th>PTS Total</th><th>Partidos</th><th>Victorias</th><th>Titles</th><th>Temporadas</th></tr></thead>
    <tbody>${sorted.map(([name,d],i) => `<tr>
      <td>${i+1}</td>
      <td>${name}${d.titulos>0?`<span class="titulo-badge">${d.titulos}</span>`:''}</td>
      <td>
        <span style="font-weight:600;color:#60a5fa">${Math.round(d.pts)}</span>
        <div class="bar-mini"><div class="bar-fill" style="width:${Math.round(d.pts/maxPts*100)}%"></div></div>
      </td>
      <td>${d.j}</td>
      <td>${d.g}</td>
      <td>${d.titulos > 0 ? '🏆'.repeat(d.titulos) : '-'}</td>
      <td>${d.temporadas}</td>
    </tr>`).join('')}
    </tbody>
  </table>`;
}

function renderCampeones() {
  const el = document.getElementById('hof-content');
  el.innerHTML = `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">
    ${SEASONS.map(s => `<div style="background:#111;border:1px solid #222;border-radius:10px;padding:12px;display:flex;align-items:center;gap:12px">
      <div style="font-size:11px;color:#555;min-width:28px;text-align:center">T${s.temporada}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:600;color:#f59e0b">🏆 ${s.campeon}</div>
        <div style="font-size:10px;color:#555;margin-top:2px">${s.fecha_ini} · ${s.partidos} partidos</div>
      </div>
      <div style="font-size:10px;color:#444;text-align:right">
        <div>🥈 ${s.subcampeon}</div>
        <div>🥉 ${s.tercero}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

renderSeasons();
</script>
</body>
</html>
